[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onscreen-capture-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openpyxl>=3.1,<4", "portalocker>=3,<5", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["onscreen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
